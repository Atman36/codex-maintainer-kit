[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-factory-kit"
version = "0.1.0"
description = "Maintainer automation toolkit for safe, reviewable, human-gated pull requests."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/Atman36/codex-maintainer-kit"
Issues = "https://github.com/Atman36/codex-maintainer-kit/issues"

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]
include = ["pr_factory_lib*"]
