[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-factory-kit"
version = "0.1.0"
description = "Prompts, schemas, and tooling for the PR Factory workflow."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.0",
]

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]
include = ["pr_factory_lib*"]
